name: Deploy to GitHub Pages

on:
    push:
        branches:
            - develop # またはmainなどデプロイしたいブランチに変更

jobs:
    deploy:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v3
              with:
                  node-version: '20' # 必要に応じてNode.jsのバージョンを指定
            - name: Install Dependencies
              run: |
                  yarn install
            - name: Build
              run: |
                  yarn build
            - name: Upload artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: ./dist # distディレクトリをアップロード
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
