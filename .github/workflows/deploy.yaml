name: Deploy to GitHub Pages

on:
    push:
        branches:
            - develop # developブランチへのpushをトリガー

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            # リポジトリをチェックアウト
            - name: Checkout code
              uses: actions/checkout@v2

            # Node.jsのセットアップ
            - name: Set up Node.js
              uses: actions/setup-node@v2
              with:
                  node-version: '20' # 必要なNode.jsのバージョンを指定

            # 依存関係をインストール
            - name: Install dependencies
              run: yarn install

            # Viteでビルド
            - name: Build with Vite
              run: yarn build

            # GitHub Pagesにデプロイ
            - name: Deploy to GitHub Pages
              uses: JamesIves/github-pages-deploy-action@v4
              with:
                  branch: gh-pages # デプロイ先のブランチ
                  folder: dist # デプロイするディレクトリ
            - env:
              GITHUB_TOKEN: ${{ secrets.GH_TOKEN }} # 作成した PAT を環境変数として渡す
